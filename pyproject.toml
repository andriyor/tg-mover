[project]
name = "tg-mover"
version = "0.1.0"
description = "Move Telegram channel messages to another channel without the 'Forwarded from' header"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.45.0",
]

[project.scripts]
tg-mover = "tg_mover.cli:run"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
